<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark rich background for crisp contrast -->
    <rect id="bg" width="64" height="64" rx="16" fill="#0b0f17"/>
    
    <!-- Neon cyan / electric blue glow on left -->
    <linearGradient id="cyanSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Neon magenta / hot violet glow on right -->
    <linearGradient id="magentaSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Outer neon ring glow -->
    <linearGradient id="splitGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Inner dark shield fill -->
    <linearGradient id="innerShield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="#090d16" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Outer Neon Halo -->
  <path d="M32 54s17-8.5 17-23.5V13L32 6.5 15 13v17.5C15 45.5 32 54 32 54z"
        stroke="url(#splitGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Inner Dark Shield Body -->
  <path d="M32 50.5s14-7 14-19.5V16.5L32 11 18 16.5V31c0 12.5 14 19.5 14 19.5z"
        fill="url(#innerShield)"/>

  <!-- Left Half Blue/Cyan Tint -->
  <path d="M32 11L18 16.5V31c0 12.5 14 19.5 14 19.5V11z"
        fill="#0284c7" fill-opacity="0.25"/>

  <!-- Right Half Pink/Magenta Tint -->
  <path d="M32 11L46 16.5V31c0 12.5-14 19.5-14 19.5V11z"
        fill="#f43f5e" fill-opacity="0.18"/>

  <!-- Center Split Neon Seam -->
  <line x1="32" y1="9" x2="32" y2="52" stroke="#67e8f9" stroke-width="1.75" stroke-linecap="round"/>
</svg>
